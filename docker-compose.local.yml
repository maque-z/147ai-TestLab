# 本地 Docker 测试环境
# 用法: docker-compose -f docker-compose.local.yml up -d --build
# 先构建前端: cd frontend && pnpm build
# 访问: http://localhost:8080

services:
  fastapi:
    build: ./backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/lab.db
      - SECRET_KEY=local-dev-secret-not-for-production
    volumes:
      - db-data-local:/app/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  db-data-local:
