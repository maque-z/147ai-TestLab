# pnpm 10+ blocks dependency lifecycle scripts unless they are named here.
# The key is `onlyBuiltDependencies` and it takes a list — `allowBuilds` with a
# map was not a key pnpm ever read, so it silently did nothing and both scripts
# stayed blocked ("Ignored build scripts: esbuild, vue-demi" on every install).
#
# The build survived that only by luck: esbuild's binary also arrives via the
# @esbuild/<platform> optional dependency, and vue-demi ships its lib/ prebuilt.
# Named properly here so neither is relying on that.
onlyBuiltDependencies:
  - esbuild
  - vue-demi
