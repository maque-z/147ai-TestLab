# 宝塔 Nginx 反向代理配置片段
# 在宝塔「网站设置 → 配置文件」中，找到 server 块，加入以下 location:

location /api/ {
    proxy_pass         http://127.0.0.1:8005;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # 图片编辑走 multipart 上传，最多 16 张参考图 × 50MB。
    # nginx 默认上限是 1MB，不放开会直接 413。
    client_max_body_size 128m;
    proxy_request_buffering off;

    # gpt-image-2 出图约 120s，4K 高质量接近 2 分钟，带参考图的编辑更久。
    # 这里必须大于后端配置里的超时时间，否则 nginx 先断，看到的是 504 而不是真实错误。
    proxy_connect_timeout 120s;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
}

# 注意: 宝塔网站根目录需指向 /path/to/147ai-TestLab/frontend/dist
# 宝塔「伪静态」选择 vue 或手动填入:
# location / { try_files $uri $uri/ /index.html; }
