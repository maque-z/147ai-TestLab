server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 反向代理 API
    location /api/ {
        proxy_pass         http://fastapi:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 图片编辑走 multipart 上传，最多 16 张参考图 × 50MB。
        # nginx 默认上限是 1MB，不放开会直接 413。
        client_max_body_size 128m;
        proxy_request_buffering off;

        # 生图响应是心跳流（NDJSON）：后端等上游出图时每 10s 吐一个换行，
        # 让连接上始终有字节流动。这是为了绕开链路上任何设备的空闲超时——
        # 曾观测到 60s 时连接被掐，nginx 记 499（客户端先走，0 字节已发）。
        #
        # buffering 必须关：开着的话 nginx 会把心跳字节攒在自己的 buffer 里，
        # 等整个响应体就绪才一次性下发，心跳就白吐了。本地无代理时看不出问题，
        # 线上照旧断——这是最容易漏、也最难查的一处。
        proxy_buffering off;
        # 后端响应头也带了 X-Accel-Buffering: no 兜底，两处都有才不怕漏配。

        # gpt-image-2 出图约 120s，4K 高质量接近 2 分钟，带参考图的编辑更久。
        # 这里必须大于后端配置里的超时时间，否则 nginx 先断，看到的是 504 而不是真实错误。
        proxy_connect_timeout 120s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
